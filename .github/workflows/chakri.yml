# এই ফাইলটা গিটহাবকে বলে দেয়: "প্রতিদিন এই সময়ে, নিজে থেকেই
# chakri_khobor.py প্রোগ্রামটা চালাও।"

name: চাকরির খবর সংগ্রহ

permissions:
  contents: write

on:
  schedule:
    # প্রতিদিন সকাল ৮টা (বাংলাদেশ সময়) - UTC সময়ে এটা রাত ২টা
    - cron: "0 2 * * *"
  workflow_dispatch: # হাতেও যেকোনো সময় চালানো যাবে

jobs:
  fetch-and-update:
    runs-on: ubuntu-latest
    steps:
      - name: কোড ডাউনলোড করা
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: পাইথন সেটআপ করা
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: OCR সরঞ্জাম ইনস্টল করা (স্ক্যান করা পিডিএফ পড়ার জন্য)
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr tesseract-ocr-ben poppler-utils

      - name: প্রয়োজনীয় লাইব্রেরি ইনস্টল করা
        run: pip install requests beautifulsoup4 pypdf pytesseract pdf2image

      - name: স্ক্রিপ্ট চালানো
        run: python chakri_khobor.py

      - name: ডাটাবেজ ফাইল গিটহাবে জমা (commit) করা
        run: |
          git config user.name "chakri-khobor-bot"
          git config user.email "chakri-khobor-bot@users.noreply.github.com"
          git add pwa/job_database.json chakri_khobor_*.md
          git diff --cached --quiet || git commit -m "দৈনিক খবর হালনাগাদ ($(date +'%d-%m-%Y'))"

          for attempt in 1 2 3 4 5; do
            if git pull --rebase && git push; then
              exit 0
            fi
            echo "push ব্যর্থ হয়েছে (চেষ্টা $attempt/5), কিছুক্ষণ পর আবার চেষ্টা করা হচ্ছে..."
            git rebase --abort 2>/dev/null || true
            sleep $((10 * attempt))
          done
          echo "৫ বার চেষ্টা করেও ডাটাবেজ commit/push করা যায়নি।"
          exit 1
